[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab"
version = "0.1.0"
description = "AI-assisted quantitative research and validation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pyarrow>=18,<24",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "infra*", "quant*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL database"]

[tool.coverage.run]
source = ["quant"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["apps", "infra", "quant", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
